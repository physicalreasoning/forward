[project]
name = "forward"
version = "0.1.0"
description = "Sealed forward tests for world models: frozen before the round, scored on outcomes that resolve after it."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Physical Reasoning" }]
requires-python = ">=3.11"
keywords = ["world models", "forecasting", "evaluation", "proper scoring rules", "prediction markets"]
dependencies = [
    "isotherm @ git+https://github.com/physicalreasoning/isotherm",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "scipy>=1.13",
]

[project.scripts]
forward = "forward.cli:main"

[project.optional-dependencies]
tsfm = [
    "chronos-forecasting>=2.3.2",
    "timesfm[torch]>=3.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.7"]
wm2 = ["pillow>=10"]  # decodes MRMS GRIB2 (PNG-packed), forward/wm2/mrms.py

[tool.uv]
default-groups = ["dev", "wm2"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP"]
ignore = ["E731"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint.per-file-ignores]
# HTML template text, wrapped as it reads on the page.
"scripts/site.py" = ["E501"]
